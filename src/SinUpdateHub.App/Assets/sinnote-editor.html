      // ---------- 表格专属悬浮扩展栏（IR / WYSIWYG 通用） ----------
      const tableBar = document.getElementById('table-bar');
      const tableDim = document.getElementById('table-dim');
      let activeTable = null;
      let activeRow = null;
      let activeCell = null;
      let scrollHookedEl = null;

      function hideTableBar() {
        activeTable = null;
        activeRow = null;
        activeCell = null;
        if (tableBar) tableBar.hidden = true;
      }

      function recordUndoSnapshot() {
        try {
          if (vditor && vditor.vditor && vditor.vditor.undo) {
            vditor.vditor.undo.addToUndoStack(vditor.vditor);
          }
        } catch (_) {
          // ignore
        }
      }

      function placeCaretInCell(cell) {
        if (!cell) return;
        const sel = window.getSelection();
        if (!sel) return;
        const range = document.createRange();
        range.selectNodeContents(cell);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      // 在表格单元格内按 Backspace 时，若光标紧跟在 <br> 后方，直接删掉该 <br> 将当前行合并回上一行，避免跳到左侧单元格
      function tryDeletePrecedingBrInTableCell() {
        const sel = window.getSelection();
        if (!sel || !sel.isCollapsed || sel.rangeCount === 0) return false;
        const range = sel.getRangeAt(0);
        const startEl = range.startContainer.nodeType === Node.ELEMENT_NODE
          ? range.startContainer
          : range.startContainer.parentElement;
        const cell = startEl && startEl.closest ? startEl.closest('th, td') : null;
        if (!cell) return false;

        const isIgnorableNode = (n) => {
          if (!n) return false;
          if (n.nodeType === Node.TEXT_NODE) {
            return (n.nodeValue || '').replace(/\u200B/g, '') === '';
          }
          if (n.nodeType === Node.ELEMENT_NODE && n.tagName === 'WBR') {
            return true;
          }
          return false;
        };

        const findPreviousMeaningful = (node, stopRoot) => {
          let cur = node;
          while (cur && cur !== stopRoot) {
            let prev = cur.previousSibling;
            while (prev && isIgnorableNode(prev)) {
              prev = prev.previousSibling;
            }
            if (prev) return prev;
            cur = cur.parentNode;
          }
          return null;
        };

        let targetBr = null;
        let anchorTextNode = null;
        let anchorOffset = 0;

        if (range.startContainer.nodeType === Node.TEXT_NODE) {
          const beforeText = (range.startContainer.nodeValue || '').slice(0, range.startOffset);
          if (beforeText.replace(/\u200B/g, '') !== '') {
            return false;
          }
          const prev = findPreviousMeaningful(range.startContainer, cell);
          if (prev && prev.nodeType === Node.ELEMENT_NODE && prev.tagName === 'BR') {
            targetBr = prev;
            anchorTextNode = range.startContainer;
            anchorOffset = range.startOffset;
          }
        } else if (range.startContainer.nodeType === Node.ELEMENT_NODE) {
          let idx = range.startOffset - 1;
          let prev = null;
          while (idx >= 0) {
            const candidate = range.startContainer.childNodes[idx];
            if (!isIgnorableNode(candidate)) {
              prev = candidate;
              break;
            }
            idx--;
          }
          if (!prev) {
            prev = findPreviousMeaningful(range.startContainer, cell);
          }
          if (prev && prev.nodeType === Node.ELEMENT_NODE && prev.tagName === 'BR') {
            targetBr = prev;
          }
        }

        if (!targetBr || !targetBr.parentNode) return false;

        recordUndoSnapshot();
        const brParent = targetBr.parentNode;
        const brPrev = targetBr.previousSibling;
        const brNext = targetBr.nextSibling;
        brParent.removeChild(targetBr);

        const nextRange = document.createRange();
        if (brPrev && brPrev.nodeType === Node.TEXT_NODE) {
          nextRange.setStart(brPrev, brPrev.nodeValue.length);
          nextRange.collapse(true);
        } else if (anchorTextNode && cell.contains(anchorTextNode)) {
          nextRange.setStart(anchorTextNode, Math.min(anchorOffset, (anchorTextNode.nodeValue || '').length));
          nextRange.collapse(true);
        } else if (brNext && brNext.nodeType === Node.TEXT_NODE) {
          nextRange.setStart(brNext, 0);
          nextRange.collapse(true);
        } else {
          nextRange.selectNodeContents(brParent);
          nextRange.collapse(false);
        }
        sel.removeAllRanges();
        sel.addRange(nextRange);

        recordUndoSnapshot();
        emitContentChangedImmediate();
        return true;
      }

      function getCurrentTableContext() {
        if (!vditor || !vditor.vditor) return null;
        const mode = vditor.vditor.currentMode || 'ir';
        if (mode === 'sv') return null;

        const root = getActiveEditorElement();
        if (!root) return null;

        if (scrollHookedEl !== root) {
          scrollHookedEl = root;
          root.addEventListener('scroll', positionTableBar, { passive: true });
        }

        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;

        let node = sel.anchorNode;
        if (!node) return null;
        if (node.nodeType === 3) node = node.parentElement;
        if (!node || !root.contains(node)) return null;

        const cell = node.closest ? node.closest('td, th') : null;
        const row = cell ? cell.closest('tr') : null;
        const table = row ? row.closest('table') : null;
        if (!cell || !row || !table || !root.contains(table)) return null;

        return { table, row, cell };
      }

      function positionTableBar() {
        if (!tableBar || !activeTable || !document.body.contains(activeTable)) {
          hideTableBar();
          return;
        }
        tableBar.hidden = false;
      }

      function updateTableBar() {
        const ctx = getCurrentTableContext();
        if (!ctx) {
          hideTableBar();
          return;
        }

        activeTable = ctx.table;
        activeRow = ctx.row;
        activeCell = ctx.cell;

        const totalRows = activeTable.rows.length;
        const totalCols = totalRows > 0 ? activeTable.rows[0].cells.length : 0;
        if (tableDim) {
          tableDim.textContent = totalRows + ' × ' + totalCols;
        }

        const tbody = activeTable.tBodies && activeTable.tBodies[0];
        const inBody = Boolean(tbody && tbody.contains(activeRow));
        const bodyRows = tbody ? Array.from(tbody.rows) : [];
        const bodyIndex = inBody ? bodyRows.indexOf(activeRow) : -1;

        const setDisabled = (act, disabled) => {
          const btn = tableBar.querySelector('button[data-act="' + act + '"]');
          if (btn) btn.disabled = Boolean(disabled);
        };

        setDisabled('delRow', totalRows <= 1);
        setDisabled('delCol', totalCols <= 1);
        setDisabled('moveUp', !inBody || bodyIndex <= 0);
        setDisabled('moveDown', !inBody || bodyIndex < 0 || bodyIndex >= bodyRows.length - 1);

        positionTableBar();
      }

      let tblBarTimer = null;
      function updateTableBarSoon() {
        if (tblBarTimer) clearTimeout(tblBarTimer);
        tblBarTimer = setTimeout(updateTableBar, 16);
      }

      function createEmptyCell(tagName, align) {
        const cell = document.createElement(tagName);
        if (align) cell.setAttribute('align', align);
        return cell;
      }

      function createRowWithTag(tagName, colCount, refRow) {
        const tr = document.createElement('tr');
        for (let c = 0; c < colCount; c++) {
          const align = refRow && refRow.cells[c] ? refRow.cells[c].getAttribute('align') : null;
          tr.appendChild(createEmptyCell(tagName, align));
        }
        return tr;
      }

      function performTableAction(act) {
        if (!activeTable || !activeRow || !activeCell || !document.body.contains(activeTable)) {
          return;
        }

        const table = activeTable;
        const row = activeRow;
        const cell = activeCell;
        const colIdx = Math.max(0, Array.from(row.cells).indexOf(cell));
        const colCount = table.rows.length > 0 ? table.rows[0].cells.length : 1;

        const thead = table.tHead || table.querySelector('thead');
        let tbody = table.tBodies && table.tBodies[0];
        if (!tbody) {
          tbody = table.createTBody();
        }

        const inHead = Boolean(thead && thead.contains(row));
        recordUndoSnapshot();

        let focusCell = cell;

        if (act === 'rowBelow') {
          if (inHead) {
            const newTr = createRowWithTag('td', colCount, row);
            tbody.insertBefore(newTr, tbody.firstElementChild);
            focusCell = newTr.cells[Math.min(colIdx, newTr.cells.length - 1)];
          } else {
            const newTr = createRowWithTag('td', colCount, row);
            row.insertAdjacentElement('afterend', newTr);
            focusCell = newTr.cells[Math.min(colIdx, newTr.cells.length - 1)];
          }
        } else if (act === 'rowAbove') {
          if (inHead) {
            const demoted = document.createElement('tr');
            Array.from(row.cells).forEach((th) => {
              const td = createEmptyCell('td', th.getAttribute('align'));
              td.innerHTML = th.innerHTML;
              demoted.appendChild(td);
              th.innerHTML = '';
            });
            tbody.insertBefore(demoted, tbody.firstElementChild);
            focusCell = row.cells[Math.min(colIdx, row.cells.length - 1)];
          } else {
            const newTr = createRowWithTag('td', colCount, row);
            row.insertAdjacentElement('beforebegin', newTr);
            focusCell = newTr.cells[Math.min(colIdx, newTr.cells.length - 1)];
          }
        } else if (act === 'delRow') {
          if (table.rows.length <= 1) return;
          if (inHead) {
            if (tbody.rows.length > 0) {
              const firstBody = tbody.rows[0];
              for (let c = 0; c < row.cells.length && c < firstBody.cells.length; c++) {
                row.cells[c].innerHTML = firstBody.cells[c].innerHTML;
              }
              firstBody.remove();
              focusCell = row.cells[Math.min(colIdx, row.cells.length - 1)];
            }
          } else {
            const nextRow = row.nextElementSibling || row.previousElementSibling || (thead ? thead.rows[0] : null);
            row.remove();
            if (nextRow && nextRow.cells.length > 0) {
              focusCell = nextRow.cells[Math.min(colIdx, nextRow.cells.length - 1)];
            }
          }
        } else if (act === 'colLeft' || act === 'colRight') {
          const insertAt = act === 'colLeft' ? colIdx : colIdx + 1;
          Array.from(table.rows).forEach((tr) => {
            const tag = (thead && thead.contains(tr)) ? 'th' : 'td';
            const refCell = tr.cells[colIdx];
            const align = refCell ? refCell.getAttribute('align') : null;
            const newCell = createEmptyCell(tag, align);
            if (insertAt < tr.cells.length) {
              tr.insertBefore(newCell, tr.cells[insertAt]);
            } else {
              tr.appendChild(newCell);
            }
          });
          focusCell = row.cells[Math.min(insertAt, row.cells.length - 1)];
        } else if (act === 'delCol') {
          if (colCount <= 1) return;
          Array.from(table.rows).forEach((tr) => {
            if (colIdx < tr.cells.length) {
              tr.deleteCell(colIdx);
            }
          });
          const nextCol = Math.min(colIdx, row.cells.length - 1);
          focusCell = row.cells[Math.max(0, nextCol)];
        } else if (act === 'moveUp') {
          if (!inHead && row.previousElementSibling) {
            tbody.insertBefore(row, row.previousElementSibling);
            focusCell = row.cells[Math.min(colIdx, row.cells.length - 1)];
          }
        } else if (act === 'moveDown') {
          if (!inHead && row.nextElementSibling) {
            tbody.insertBefore(row.nextElementSibling, row);
            focusCell = row.cells[Math.min(colIdx, row.cells.length - 1)];
          }
        }

        if (focusCell) {
          placeCaretInCell(focusCell);
        }
        recordUndoSnapshot();
        updateTableBar();
        emitContentChangedImmediate();
      }

      function bindTableFloatingBar() {
        if (!tableBar) return;

        // 将表格操作条停靠到 .vditor-toolbar 正下方（.vditor-content 之前），占据独立流高度，永不遮挡表格内容
        const tb = document.querySelector('.vditor-toolbar');
        if (tb && tb.parentNode) {
          tb.parentNode.insertBefore(tableBar, tb.nextSibling);
        }

        tableBar.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
        });

        tableBar.addEventListener('click', (e) => {
          const btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
          if (!btn || btn.disabled) return;
          performTableAction(btn.getAttribute('data-act'));
        });

        document.addEventListener('selectionchange', updateTableBarSoon);
        document.addEventListener('keyup', updateTableBarSoon, true);
        document.addEventListener('click', updateTableBarSoon, true);
        window.addEventListener('resize', positionTableBar);
      }

      // ---------- 文本对齐（左对齐 / 居中 / 右对齐） ----------
      function applyTextAlignment(align) {
        const root = getActiveEditorElement();
        if (!root) return;
        const sel = window.getSelection();
        const range = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0) : savedSelectionRange;
        if (!range) return;

        let node = range.commonAncestorContainer;
        if (node.nodeType === 3) node = node.parentElement;
        if (!node || !root.contains(node)) return;

        // 1) 在表格单元格内：按 GFM 标准设置当前列对齐（align="left|center|right"）
        const cell = node.closest ? node.closest('td, th') : null;
        if (cell && root.contains(cell)) {
          const row = cell.closest('tr');
          const table = row ? row.closest('table') : null;
          if (table) {
            const colIdx = Array.from(row.cells).indexOf(cell);
            recordUndoSnapshot();
            Array.from(table.rows).forEach((tr) => {
              const c = tr.cells[colIdx];
              if (c) {
                c.setAttribute('align', align);
                c.style.textAlign = align;
              }
            });
            recordUndoSnapshot();
            emitContentChangedImmediate();
            return;
          }
        }

        // 2) 普通段落/标题：设置或更新外层 align 容器（HTML <div align="..."> 兼容 Markdown 持久化）
        const block = node.closest ? node.closest('p, h1, h2, h3, h4, h5, h6, blockquote, li') : null;
        if (!block || !root.contains(block)) return;

        recordUndoSnapshot();
        const alignedParent = block.parentElement && block.parentElement.tagName === 'DIV' && block.parentElement.hasAttribute('align')
          ? block.parentElement
          : null;

        if (align === 'left') {
          block.style.textAlign = '';
          block.removeAttribute('align');
          if (alignedParent && root.contains(alignedParent)) {
            while (alignedParent.firstChild) {
              alignedParent.parentNode.insertBefore(alignedParent.firstChild, alignedParent);
            }
            alignedParent.remove();
          }
        } else {
          if (alignedParent) {
            alignedParent.setAttribute('align', align);
            alignedParent.style.textAlign = align;
          } else {
            block.setAttribute('align', align);
            block.style.textAlign = align;
          }
        }

        recordUndoSnapshot();
        emitContentChangedImmediate();
      }

      // ---------- 选中文本浮动格式条（高亮 + 字体颜色 + 对齐 + 局部字体，跨单元格多选零破坏） ----------
      function getLiveOrSavedRange() {
        const root = getActiveEditorElement();
        if (!root) return null;
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
          const r = sel.getRangeAt(0);
          let anc = r.commonAncestorContainer;
          if (anc.nodeType === 3) anc = anc.parentElement;
          if (anc && root.contains(anc)) {
            return r;
          }
        }
        if (savedSelectionRange && !savedSelectionRange.collapsed) {
          let anc = savedSelectionRange.commonAncestorContainer;
          if (anc.nodeType === 3) anc = anc.parentElement;
          if (anc && root.contains(anc)) {
            return savedSelectionRange;
          }
        }
        return null;
      }

      /**
       * 收集选区内所有可见正文文本节点片段：
       * - 严格排除 .vditor-ir__marker（Vditor IR 隐藏的 Markdown/HTML 源码标记节点），避免误高亮空标记；
       * - 严格留在各自单元格/段落内部，绝不跨 <td>/<th>/<tr> 破坏表格结构。
       */
      function collectTextSlicesInRange(range) {
        const root = getActiveEditorElement();
        if (!root || !range || range.collapsed) return [];

        const slices = [];
        const common = range.commonAncestorContainer;

        const isHiddenOrCode = (el) => {
          if (!el || !root.contains(el)) return true;
          if (el.closest && el.closest('.vditor-ir__marker, pre.vditor-ir__marker--pre, code.hljs, .vditor-ir__node[data-type="code-block"]')) {
            return true;
          }
          return false;
        };

        if (common.nodeType === 3) {
          if (isHiddenOrCode(common.parentElement)) return slices;
          const s = range.startOffset;
          const e = range.endOffset;
          if (e > s && common.nodeValue && common.nodeValue.slice(s, e).replace(/\u200B/g, '').length > 0) {
            slices.push({ node: common, start: s, end: e });
          }
          return slices;
        }

        const walker = document.createTreeWalker(common, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue || node.nodeValue.replace(/\u200B/g, '').length === 0) {
              return NodeFilter.FILTER_REJECT;
            }
            if (isHiddenOrCode(node.parentElement)) {
              return NodeFilter.FILTER_REJECT;
            }
            try {
              if (!range.intersectsNode(node)) return NodeFilter.FILTER_REJECT;
            } catch (_) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        });

        let tn;
        while ((tn = walker.nextNode())) {
          let start = 0;
          let end = tn.nodeValue.length;
          if (tn === range.startContainer) {
            start = range.startOffset;
          }
          if (tn === range.endContainer) {
            end = range.endOffset;
          }
          if (end > start && tn.nodeValue.slice(start, end).replace(/\u200B/g, '').length > 0) {
            slices.push({ node: tn, start, end });
          }
        }
        return slices;
      }

      function escapeHtmlText(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function sanitizeCssStyleValue(val) {
        return String(val || '').replace(/"/g, "'").replace(/[;<>]/g, '').trim();
      }

      /**
       * 直接构造 Vditor IR 标准行内 HTML 节点三元组（开标记 html-inline + 视觉代理 .sinnote-styled-proxy + 闭标记 html-inline），
       * 无需经过 Lute 二次解析：
       * - 浏览器立即按 inline style 渲染高亮、字体颜色与局部字体；
       * - Vditor Lute VditorIRDOM2Md 自动忽略代理壳并 100% 完整保留 <mark style="..."> / <span style="..."> 到 Markdown。
       */
      function buildVditorIrHtmlInlineFragment(tagName, styleMap, rawText) {
        const entries = Object.entries(styleMap).filter(([, v]) => v && String(v).trim());
        const cleanText = String(rawText || '').replace(/\u200B/g, '');
        if (!cleanText) return null;

        const frag = document.createDocumentFragment();
        if (entries.length === 0) {
          frag.appendChild(document.createTextNode(cleanText));
          return frag;
        }

        const styleStr = entries.map(([k, v]) => k + ':' + sanitizeCssStyleValue(v)).join(';');
        const mode = (vditor && vditor.vditor && vditor.vditor.currentMode) || 'ir';

        if (mode === 'wysiwyg') {
          const el = document.createElement(tagName);
          el.setAttribute('style', styleStr);
          el.textContent = cleanText;
          frag.appendChild(el);
          return frag;
        }

        const openSpan = document.createElement('span');
        openSpan.setAttribute('data-type', 'html-inline');
        openSpan.className = 'vditor-ir__node';
        const openCode = document.createElement('code');
        openCode.className = 'vditor-ir__marker';
        openCode.textContent = '<' + tagName + ' style="' + styleStr + '">';
        openSpan.appendChild(openCode);

        const proxy = document.createElement('span');
        proxy.className = 'sinnote-styled-proxy';
        proxy.setAttribute('data-tag', tagName);
        proxy.setAttribute('style', styleStr);
        proxy.textContent = cleanText;

        const closeSpan = document.createElement('span');
        closeSpan.setAttribute('data-type', 'html-inline');
        closeSpan.className = 'vditor-ir__node';
        const closeCode = document.createElement('code');
        closeCode.className = 'vditor-ir__marker';
        closeCode.textContent = '</' + tagName + '>';
        closeSpan.appendChild(closeCode);

        frag.appendChild(openSpan);
        frag.appendChild(proxy);
        frag.appendChild(closeSpan);
        return frag;
      }

      /**
       * 将 Vditor IR 中成对的 html-inline 隐藏标记（<mark style="..."> ... </mark> 或 <span style="..."> ... </span>）
       * 中间的正文节点包裹为视觉代理 <span class="sinnote-styled-proxy" style="...">，使高亮、字色与局部字体立即实时生效；
       * 且 Lute VditorIRDOM2Md 序列化时会自动忽略裸代理壳，100% 完整保留原始 Markdown HTML 标签。
       */
      function parseInlineOpenTag(markerText) {
        const m = /^<(mark|span)\b[^>]*\bstyle\s*=\s*["']([^"']+)["'][^>]*>$/i.exec((markerText || '').trim());
        if (!m) return null;
        return { tag: m[1].toLowerCase(), style: m[2].trim() };
      }

      function parseInlineCloseTag(markerText) {
        const m = /^<\/(mark|span)\s*>$/i.exec((markerText || '').trim());
        return m ? m[1].toLowerCase() : null;
      }

      let isHydratingInlineStyles = false;
      function hydrateInlineHtmlStyles() {
        if (isHydratingInlineStyles) return;
        const root = getActiveEditorElement();
        if (!root) return;

        isHydratingInlineStyles = true;
        try {
          const openMarkers = Array.from(root.querySelectorAll('span.vditor-ir__node[data-type="html-inline"]'));
          openMarkers.forEach((openNode) => {
            if (!openNode.parentNode) return;
            const openCode = openNode.querySelector('.vditor-ir__marker');
            const parsed = openCode ? parseInlineOpenTag(openCode.textContent) : null;
            if (!parsed) return;

            const between = [];
            let cur = openNode.nextSibling;
            let closeNode = null;
            while (cur) {
              if (cur.nodeType === 1 && cur.matches && cur.matches('span.vditor-ir__node[data-type="html-inline"]')) {
                const closeCode = cur.querySelector('.vditor-ir__marker');
                const closeTag = closeCode ? parseInlineCloseTag(closeCode.textContent) : null;
                if (closeTag === parsed.tag) {
                  closeNode = cur;
                  break;
                }
              }
              between.push(cur);
              cur = cur.nextSibling;
            }

            if (!closeNode || between.length === 0) return;

            if (between.length === 1
              && between[0].nodeType === 1
              && between[0].classList
              && between[0].classList.contains('sinnote-styled-proxy')) {
              const proxy = between[0];
              if (proxy.getAttribute('style') !== parsed.style || proxy.getAttribute('data-tag') !== parsed.tag) {
                proxy.setAttribute('style', parsed.style);
                proxy.setAttribute('data-tag', parsed.tag);
              }
              return;
            }

            const proxy = document.createElement('span');
            proxy.className = 'sinnote-styled-proxy';
            proxy.setAttribute('data-tag', parsed.tag);
            proxy.setAttribute('style', parsed.style);
            openNode.parentNode.insertBefore(proxy, between[0]);
            between.forEach((n) => proxy.appendChild(n));
          });
        } finally {
          isHydratingInlineStyles = false;
        }
      }

      let hydrateTimer = null;
      function scheduleHydrateStyles() {
        if (hydrateTimer) clearTimeout(hydrateTimer);
        hydrateTimer = setTimeout(hydrateInlineHtmlStyles, 20);
      }

      let styleObserver = null;
      function observeEditorInlineStyles() {
        const root = getActiveEditorElement();
        if (!root || styleObserver) return;
        styleObserver = new MutationObserver(() => {
          if (!isHydratingInlineStyles) {
            scheduleHydrateStyles();
          }
        });
        styleObserver.observe(root, { childList: true, subtree: true });
      }

      /**
       * 从已有的 .sinnote-styled-proxy 或 <mark>/<span style="..."> 中读取已有行内样式字典，
       * 并同时记录左右成对的 html-inline 标记节点，便于二次修改或彻底清除。
       */
      function extractExistingInlineStyle(node) {
        const result = { bg: '', color: '', fontFamily: '', proxyEl: null, openMarker: null, closeMarker: null };
        const el = node.nodeType === 3 ? node.parentElement : node;
        if (!el || !el.closest) return result;

        const proxy = el.closest('span.sinnote-styled-proxy');
        if (proxy) {
          result.proxyEl = proxy;
          if (proxy.style.backgroundColor) result.bg = proxy.style.backgroundColor;
          if (proxy.style.color) result.color = proxy.style.color;
          if (proxy.style.fontFamily) result.fontFamily = proxy.style.fontFamily.replace(/"/g, "'");

          const prev = proxy.previousSibling;
          const next = proxy.nextSibling;
          if (prev && prev.nodeType === 1 && prev.matches && prev.matches('span.vditor-ir__node[data-type="html-inline"]')) {
            result.openMarker = prev;
          }
          if (next && next.nodeType === 1 && next.matches && next.matches('span.vditor-ir__node[data-type="html-inline"]')) {
            result.closeMarker = next;
          }
          return result;
        }

        const styledEl = el.closest('mark, span[style]');
        if (styledEl) {
          if (styledEl.style.backgroundColor) result.bg = styledEl.style.backgroundColor;
          if (styledEl.style.color) result.color = styledEl.style.color;
          if (styledEl.style.fontFamily) result.fontFamily = styledEl.style.fontFamily.replace(/"/g, "'");
        }
        return result;
      }

      /**
       * 安全逐文本切片应用行内样式（highlight / color / font）：
       * - 全部通过 Lute Md2VditorIRDOM 生成标准 IR html-inline 标记 + hydrateInlineHtmlStyles 实时代理渲染；
       * - 支持单个单元格内部分/全部文字，也支持跨多行多列单元格多选而不破坏表格结构；
       * - 立即生效且 100% 持久化保存，切页/刷新绝不还原。
       */
      function applyInlineStyleToRange(targetRange, kind, val1, val2) {
        const range = targetRange || getLiveOrSavedRange();
        if (!range || range.collapsed) return false;

        const slices = collectTextSlicesInRange(range);
        if (slices.length === 0) return false;

        slices.forEach(({ node, start, end }) => {
          if (!node.parentNode) return;

          const existing = extractExistingInlineStyle(node);
          const fullText = node.nodeValue || '';
          const selectedText = fullText.slice(start, end).replace(/\u200B/g, '');
          if (!selectedText) return;

          const nextStyle = {
            'background-color': existing.bg,
            'color': existing.color,
            'font-family': existing.fontFamily
          };

          if (kind === 'highlight') {
            if (!val1) {
              nextStyle['background-color'] = '';
              if (nextStyle['color'] === 'rgb(17, 24, 39)' || nextStyle['color'].toLowerCase() === '#111827') {
                nextStyle['color'] = '';
              }
            } else {
              nextStyle['background-color'] = val1;
              nextStyle['color'] = val2 || pickContrastForeground(val1);
            }
          } else if (kind === 'color') {
            nextStyle['color'] = val1 || '';
          } else if (kind === 'font') {
            nextStyle['font-family'] = val1 ? sanitizeCssStyleValue(val1) : '';
          }

          const tagName = nextStyle['background-color'] ? 'mark' : 'span';
          const isWholeNodeSelected = start === 0 && end >= fullText.length;

          // 若整个文本节点被选中且它位于一个已水合的 proxy 内，替换掉 [openMarker, proxy, closeMarker] 整组节点（避免嵌套）
          if (isWholeNodeSelected && existing.proxyEl && existing.proxyEl.parentNode) {
            const frag = buildVditorIrHtmlInlineFragment(tagName, nextStyle, selectedText);
            if (frag) {
              const parent = existing.proxyEl.parentNode;
              if (existing.openMarker && existing.openMarker.parentNode === parent) {
                existing.openMarker.remove();
              }
              if (existing.closeMarker && existing.closeMarker.parentNode === parent) {
                existing.closeMarker.remove();
              }
              parent.replaceChild(frag, existing.proxyEl);
            }
            return;
          }

          // 若仅选中文本节点中间一段：切分出精确子文本并替换为标准 IR 节点
          let targetNode = node;
          if (end < targetNode.nodeValue.length) {
            targetNode.splitText(end);
          }
          if (start > 0) {
            targetNode = targetNode.splitText(start);
          }

          const frag = buildVditorIrHtmlInlineFragment(tagName, nextStyle, selectedText);
          if (frag && targetNode.parentNode) {
            targetNode.parentNode.replaceChild(frag, targetNode);
          }
        });

        // 立刻水合成对 html-inline 节点，让高亮、字体颜色与局部字体肉眼即刻呈现
        hydrateInlineHtmlStyles();

        const sel = window.getSelection();
        if (sel) sel.removeAllRanges();
        savedSelectionRange = null;
        savedFontSelectionRange = null;
        clearTableCellSelection();
        recordUndoSnapshot();
        emitContentChangedImmediate();
        hideSelectionBar();
        return true;
      }

      function applyHighlightToSelection(bgHex, fgHex) {
        applyInlineStyleToRange(null, 'highlight', bgHex, fgHex);
      }

      function applyTextColorToSelection(hex) {
        applyInlineStyleToRange(null, 'color', hex, null);
      }

      function applyFontFamilyToSelection(cssFont, rangeOverride) {
        applyInlineStyleToRange(rangeOverride, 'font', cssFont, null);
      }

      function openSelectionPalette(kind, anchorEl) {
        if (!selectionPalette || !selPaletteGrid) return;
        if (!selectionPalette.hidden && activePaletteKind === kind) {
          selectionPalette.hidden = true;
          activePaletteKind = null;
          return;
        }

        activePaletteKind = kind;
        selPaletteTitle.textContent = kind === 'highlight' ? '文本突出显示颜色（高亮）' : '字体颜色';
        selPaletteGrid.innerHTML = '';

        if (kind === 'highlight') {
          HIGHLIGHT_COLOR_PRESETS.forEach((p) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sinnote-swatch-btn';
            btn.style.backgroundColor = p.bg;
            btn.title = p.name;
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              e.stopPropagation();
              currentHighlight = p;
              if (selHlBar) selHlBar.style.backgroundColor = p.bg;
              applyHighlightToSelection(p.bg, p.fg);
            });
            selPaletteGrid.appendChild(btn);
          });
        } else {
          TEXT_COLOR_PRESETS.forEach((p) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sinnote-swatch-btn';
            btn.style.backgroundColor = p.hex;
            btn.title = p.name;
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              e.stopPropagation();
              currentTextColor = p.hex;
              if (selFgBar) selFgBar.style.backgroundColor = p.hex;
              applyTextColorToSelection(p.hex);
            });
            selPaletteGrid.appendChild(btn);
          });
        }

        positionPopoverUnder(selectionPalette, anchorEl);
      }

      function updateSelectionBar() {
        if (!selectionBar || !vditor || !vditor.vditor) return;
        if ((vditor.vditor.currentMode || 'ir') === 'sv') {
          hideSelectionBar();
          return;
        }

        const root = getActiveEditorElement();
        const sel = window.getSelection();
        if (!root || !sel || sel.rangeCount === 0 || sel.isCollapsed) {
          if (selectionPalette && !selectionPalette.hidden) return;
          hideSelectionBar();
          return;
        }

        const text = sel.toString();
        if (!text || !text.trim()) {
          hideSelectionBar();
          return;
        }

        const range = sel.getRangeAt(0);
        let anc = range.commonAncestorContainer;
        if (anc.nodeType === 3) anc = anc.parentElement;
        if (!anc || !root.contains(anc)) {
          hideSelectionBar();
          return;
        }

        // 代码块内部不弹高亮颜色浮条
        if (anc.closest && anc.closest('pre.vditor-ir__marker--pre, code.hljs, .vditor-ir__node[data-type="code-block"]')) {
          hideSelectionBar();
          return;
        }

        savedSelectionRange = range.cloneRange();
        const rect = range.getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) {
          hideSelectionBar();
          return;
        }

        selectionBar.hidden = false;
        const barRect = selectionBar.getBoundingClientRect();
        const tbEl = document.querySelector('.vditor-toolbar');
        const tblBarBottom = (tableBar && !tableBar.hidden) ? tableBar.getBoundingClientRect().bottom : 0;
        const minTop = Math.max(tbEl ? tbEl.getBoundingClientRect().bottom + 4 : 6, tblBarBottom + 4);

        let top = rect.top - barRect.height - 8;
        let left = rect.left + (rect.width - barRect.width) / 2;
        const maxLeft = Math.max(8, window.innerWidth - barRect.width - 12);
        left = Math.min(Math.max(8, left), maxLeft);

        if (top < minTop) {
          top = Math.min(window.innerHeight - barRect.height - 10, rect.bottom + 8);
        }

        selectionBar.style.top = Math.round(top) + 'px';
        selectionBar.style.left = Math.round(left) + 'px';
      }

      let selBarTimer = null;
      function updateSelectionBarSoon() {
        if (selBarTimer) clearTimeout(selBarTimer);
        selBarTimer = setTimeout(updateSelectionBar, 35);
      }

      function bindSelectionToolbar() {
        if (!selectionBar) return;

        selectionBar.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
        });

        if (selectionPalette) {
          selectionPalette.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
        }

        if (selHlApply) {
          selHlApply.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            applyHighlightToSelection(currentHighlight.bg, currentHighlight.fg);
          });
        }

        if (selHlMenu) {
          selHlMenu.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openSelectionPalette('highlight', selHlApply);
          });
        }

        if (selFgApply) {
          selFgApply.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            applyTextColorToSelection(currentTextColor);
          });
        }

        if (selFgMenu) {
          selFgMenu.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openSelectionPalette('color', selFgApply);
          });
        }

        if (selPaletteClear) {
          selPaletteClear.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (activePaletteKind === 'highlight') {
              applyHighlightToSelection(null, null);
            } else {
              applyTextColorToSelection(null);
            }
          });
        }

        selectionBar.querySelectorAll('button[data-align]').forEach((btn) => {
          btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            applyTextAlignment(btn.getAttribute('data-align'));
            hideSelectionBar();
          });
        });

        document.addEventListener('selectionchange', updateSelectionBarSoon);
        document.addEventListener('mouseup', updateSelectionBarSoon);
        document.addEventListener('keyup', updateSelectionBarSoon);
      }
    })();
  </script>
</body>
</html>
