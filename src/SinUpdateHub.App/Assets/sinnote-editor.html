<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SinNote Markdown Editor</title>
  <link rel="stylesheet" href="https://sinnote.local/vditor/dist/index.css" />
  <style>
    :root {
      --bg-0: #0D1117;
      --bg-1: #161B22;
      --bg-2: #21262D;
      --border: #30363D;
      --accent: #A371F7;
      --text-primary: #E6EDF3;
      --text-secondary: #8B949E;
      --tbl-header-bg: #2F75B5;
      --tbl-header-fg: #FFFFFF;
      --tbl-firstcol-bg: #2F75B5;
      --tbl-firstcol-fg: #FFFFFF;
      --tbl-cell-bg: #1E2D3D;
      --tbl-cell-fg: #E6EDF3;
      --editor-font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      --editor-font-size: 15px;
      --editor-line-height: 1.72;
      --editor-zoom: 1;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-0);
      color: var(--text-primary);
      font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    #vditor {
      width: 100%;
      height: 100vh;
      border: none !important;
      background-color: var(--bg-0) !important;
    }

    .vditor {
      --panel-background-color: var(--bg-1);
      --toolbar-background-color: var(--bg-1);
      --toolbar-icon-color: #C9D1D9;
      --toolbar-icon-hover-color: var(--accent);
      --textarea-background-color: var(--bg-0);
      --textarea-text-color: var(--text-primary);
      --border-color: var(--border);
      --second-color: #8B949E;
      --hover-background-color: var(--bg-2);
      --heading-border-color: var(--border);
      --blockquote-color: #9DA7B3;
      --ir-heading-color: #F0F6FC;
      --ir-title-color: #D2A8FF;
      --ir-bi-color: #79C0FF;
      --ir-link-color: #79C0FF;
      --ir-bracket-color: #6E7681;
      --ir-paren-color: #6E7681;
      border: none !important;
      border-radius: 0 !important;
    }

    .vditor-toolbar {
      display: flex !important;
      align-items: center !important;
      flex-wrap: wrap !important;
      row-gap: 4px !important;
      background-color: var(--bg-1) !important;
      border-bottom: 1px solid var(--border) !important;
      padding: 5px 14px !important;
      position: relative !important;
      z-index: 1000010 !important;
      overflow: visible !important;
    }

    .vditor-toolbar__item {
      float: none !important;
      display: inline-flex;
      align-items: center;
    }

    .vditor-toolbar__divider {
      float: none !important;
      height: 16px !important;
      margin: 0 6px !important;
    }

    /* 顶部工具栏及编辑器内所有浮条的悬停提示一律向下弹出，彻底避免被顶部工具栏或视口顶边遮挡 */
    .vditor-toolbar .vditor-tooltipped::after,
    .vditor-panel .vditor-tooltipped::after {
      top: 100% !important;
      bottom: auto !important;
      margin-top: 7px !important;
      margin-bottom: 0 !important;
      left: 50% !important;
      right: auto !important;
      transform: translateX(-50%) !important;
      background-color: #2D333B !important;
      color: #F0F6FC !important;
      font-size: 12px !important;
      padding: 5px 10px !important;
      border-radius: 5px !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5) !important;
      z-index: 1000040 !important;
    }

    .vditor-toolbar .vditor-tooltipped::before,
    .vditor-panel .vditor-tooltipped::before {
      top: 100% !important;
      bottom: auto !important;
      margin-top: -3px !important;
      margin-bottom: 0 !important;
      left: 50% !important;
      right: auto !important;
      margin-left: -5px !important;
      margin-right: 0 !important;
      border-top-color: transparent !important;
      border-bottom-color: #2D333B !important;
      z-index: 1000041 !important;
    }

    /* WYSIWYG 模式下隐藏 Vditor 自带的重复表格浮条（统一使用顶部停靠的全中文 #table-bar，不遮挡表头） */
    .vditor-wysiwyg .vditor-panel:has(button[data-type="insertRowA"]),
    .vditor-wysiwyg .vditor-panel:has(button[data-type="deleteRow"]),
    .vditor-wysiwyg .vditor-panel:has(input[aria-label*="行"]) {
      display: none !important;
    }

    .vditor-toolbar .vditor-tooltipped__ne::after,
    .vditor-toolbar > .vditor-toolbar__item:first-child .vditor-tooltipped::after {
      left: 0 !important;
      right: auto !important;
      margin-left: 0 !important;
      transform: none !important;
    }

    .vditor-toolbar .vditor-tooltipped__nw::after {
      left: auto !important;
      right: 0 !important;
      margin-right: 0 !important;
      transform: none !important;
    }

    .vditor-toolbar .vditor-panel,
    .vditor-toolbar .vditor-hint {
      top: calc(100% + 4px) !important;
      bottom: auto !important;
      margin-top: 0 !important;
      transform: none !important;
      z-index: 1000025 !important;
    }

    .vditor-toolbar__item {
      position: relative !important;
    }

    /* 整合到 Vditor 工具栏末尾的配色 / 字体紧凑按钮 */
    .sinnote-tb-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 8px;
      margin-right: 4px;
      background: #21262D;
      color: #E6EDF3;
      border: 1px solid #30363D;
      border-radius: 5px;
      font-size: 11.5px;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.12s, border-color 0.12s;
    }

    .sinnote-tb-btn:hover {
      background: #2D333B;
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .sinnote-tb-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      display: inline-block;
      flex-shrink: 0;
    }

    .sinnote-tb-aa {
      color: var(--accent);
      font-weight: 700;
      font-size: 11.5px;
    }

    .vditor-content {
      background-color: var(--bg-0) !important;
    }

    .vditor-ir pre.vditor-reset,
    .vditor-wysiwyg pre.vditor-reset,
    .vditor-sv {
      background-color: var(--bg-0) !important;
      color: var(--text-primary) !important;
      padding: 18px 26px 96px 26px !important;
      font-size: var(--editor-font-size) !important;
      line-height: var(--editor-line-height) !important;
      font-family: var(--editor-font-family) !important;
      zoom: var(--editor-zoom);
    }

    .vditor-reset pre code,
    .vditor-reset code {
      font-size: 0.92em !important;
    }

    .vditor-reset h1,
    .vditor-reset h2,
    .vditor-reset h3,
    .vditor-reset h4 {
      color: #F0F6FC;
      border-bottom-color: var(--border);
    }

    .vditor-reset a {
      color: #79C0FF;
    }

    .vditor-reset blockquote {
      border-left-color: var(--accent);
      color: #9DA7B3;
      background: rgba(163, 113, 247, 0.06);
      padding: 4px 12px;
      border-radius: 0 4px 4px 0;
    }

    /* 图片：悬停正常指针；单击紫色高亮选中（按 Backspace/Delete 删除）；双击页内放大 */
    .vditor-reset img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: box-shadow 0.12s, outline-color 0.12s;
    }

    .vditor-reset img.sinnote-img-selected {
      outline: 2.5px solid var(--accent) !important;
      outline-offset: 2px;
      box-shadow: 0 0 0 5px rgba(163, 113, 247, 0.25) !important;
    }

    /* OneNote 风格表格配色（首行 / 首列 / 正文区分，可由工具栏实时调色） */
    .vditor-reset table {
      border-collapse: collapse;
      width: auto;
      min-width: 360px;
      margin: 12px 0;
      border-radius: 4px;
    }

    .vditor-reset table tr {
      background-color: transparent !important;
      border-top: none !important;
    }

    .vditor-reset table th,
    .vditor-reset table td {
      border: 1px solid #485464 !important;
      padding: 7px 12px !important;
      min-width: 78px;
      min-height: 30px;
      height: 30px;
      vertical-align: middle;
      word-break: break-word;
    }

    .vditor-reset table th:empty::before,
    .vditor-reset table td:empty::before {
      content: "\200B";
    }

    .vditor-reset table thead th,
    .vditor-reset table thead tr {
      background-color: var(--tbl-header-bg) !important;
      color: var(--tbl-header-fg) !important;
      font-weight: 600;
    }

    .vditor-reset table tbody tr td:first-child {
      background-color: var(--tbl-firstcol-bg) !important;
      color: var(--tbl-firstcol-fg) !important;
      font-weight: 500;
    }

    .vditor-reset table tbody tr td:not(:first-child) {
      background-color: var(--tbl-cell-bg) !important;
      color: var(--tbl-cell-fg) !important;
    }

    /* Ctrl+A+A / Ctrl+A+A+A 选中单元格高亮反馈 */
    .vditor-reset table th.sinnote-cell-selected,
    .vditor-reset table td.sinnote-cell-selected {
      box-shadow: inset 0 0 0 2px var(--accent) !important;
      filter: brightness(1.18);
    }

    /* 选中文本高亮标记与自定义字色 / 局部字体渲染代理（不影响 Lute Markdown 序列化） */
    .vditor-reset mark,
    .vditor-reset .sinnote-styled-proxy[data-tag="mark"] {
      padding: 0 2px;
      border-radius: 3px;
    }

    .vditor-hint,
    .vditor-panel {
      background-color: var(--bg-1) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-primary) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45) !important;
    }

    /* 表格专属中文操作条（停靠在编辑器顶部工具栏正下方、正文区之上，绝不遮挡任何表格单元格） */
    .sinnote-table-bar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 5px 16px;
      background-color: #131820;
      border-bottom: 1px solid #30363D;
      user-select: none;
      flex-shrink: 0;
    }

    .sinnote-table-bar[hidden] {
      display: none !important;
    }

    .sinnote-tbl-btn {
      appearance: none;
      background: #21262D;
      color: #E6EDF3;
      border: 1px solid #30363D;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11.5px;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      cursor: pointer;
      line-height: 1.4;
      white-space: nowrap;
      transition: background-color 0.12s, border-color 0.12s;
    }

    .sinnote-tbl-btn:hover:not(:disabled) {
      background: #30363D;
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .sinnote-tbl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .sinnote-tbl-sep {
      width: 1px;
      height: 16px;
      background: #30363D;
      margin: 0 2px;
    }

    .sinnote-tbl-dim {
      font-size: 11px;
      color: #8B949E;
      padding: 0 4px;
      font-family: Consolas, monospace;
      white-space: nowrap;
    }

    /* 工具栏配色 / 字体格式内联浮层 */
    .sinnote-popover {
      position: fixed;
      z-index: 1000030;
      width: 276px;
      padding: 12px;
      background: #161B22;
      border: 1px solid #444C56;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
      color: #E6EDF3;
      font-size: 12px;
    }

    .sinnote-popover[hidden] {
      display: none !important;
    }

    .sinnote-pop-title {
      font-size: 12px;
      font-weight: 600;
      color: #F0F6FC;
      margin: 0 0 8px 0;
    }

    .sinnote-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .sinnote-swatch-btn {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      cursor: pointer;
      padding: 0;
    }

    .sinnote-swatch-btn:hover {
      border: 2px solid #FFFFFF;
    }

    .sinnote-pop-hint {
      font-size: 11px;
      color: #8B949E;
      margin: 0 0 6px 0;
      line-height: 1.45;
    }

    .sinnote-hex-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .sinnote-hex-input {
      flex: 1;
      height: 28px;
      padding: 0 8px;
      border-radius: 5px;
      border: 1px solid #30363D;
      background: #0D1117;
      color: #E6EDF3;
      font-family: Consolas, monospace;
      font-size: 12px;
      outline: none;
    }

    .sinnote-hex-input:focus {
      border-color: var(--accent);
    }

    .sinnote-pop-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid #30363D;
      background: #21262D;
      color: #E6EDF3;
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .sinnote-pop-btn:hover {
      background: #30363D;
      border-color: var(--accent);
    }

    .sinnote-pop-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
    }

    .sinnote-pop-btn.primary:hover {
      filter: brightness(1.08);
    }

    .sinnote-pop-btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--accent);
      padding: 0 6px;
      height: 24px;
    }

    .sinnote-pop-btn.ghost:hover {
      background: rgba(163, 113, 247, 0.14);
    }

    .sinnote-font-search {
      width: 100%;
      height: 28px;
      padding: 0 9px;
      margin-bottom: 8px;
      border-radius: 5px;
      border: 1px solid #30363D;
      background: #0D1117;
      color: #E6EDF3;
      font-size: 12px;
      outline: none;
    }

    .sinnote-font-search:focus {
      border-color: var(--accent);
    }

    .sinnote-font-list {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 10px;
      padding-right: 2px;
    }

    .sinnote-font-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: #E6EDF3;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .sinnote-font-item:hover {
      background: #21262D;
      border-color: #30363D;
    }

    .sinnote-font-item.is-active {
      border-color: var(--accent);
      background: rgba(163, 113, 247, 0.18);
      color: #FFFFFF;
    }

    .sinnote-font-count {
      font-size: 11px;
      color: #8B949E;
      font-weight: 400;
    }

    /* 选中文本悬浮迷你格式栏（文本高亮 + 字体颜色，参考 OneNote） */
    .sinnote-sel-bar {
      position: fixed;
      z-index: 1000040;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      background: #161B22;
      border: 1px solid #444C56;
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6);
      user-select: none;
    }

    .sinnote-sel-bar[hidden] {
      display: none !important;
    }

    .sinnote-sel-split {
      display: inline-flex;
      align-items: center;
      border-radius: 5px;
      border: 1px solid #30363D;
      background: #21262D;
      overflow: hidden;
    }

    .sinnote-sel-main,
    .sinnote-sel-arrow,
    .sinnote-sel-iconbtn {
      appearance: none;
      border: none;
      background: transparent;
      color: #E6EDF3;
      cursor: pointer;
      height: 26px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      font-size: 12px;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }

    .sinnote-sel-arrow {
      padding: 0 4px;
      font-size: 9px;
      color: #8B949E;
      border-left: 1px solid #30363D;
    }

    .sinnote-sel-iconbtn {
      border: 1px solid #30363D;
      background: #21262D;
      border-radius: 5px;
      padding: 0 8px;
      font-size: 11.5px;
    }

    .sinnote-sel-main:hover,
    .sinnote-sel-arrow:hover,
    .sinnote-sel-iconbtn:hover {
      background: #30363D;
      color: #FFFFFF;
    }

    .sinnote-sel-indicator {
      width: 14px;
      height: 3px;
      border-radius: 1.5px;
      margin-top: 1px;
    }

    .sinnote-sel-palette {
      position: fixed;
      z-index: 1000050;
      padding: 8px 10px;
      background: #161B22;
      border: 1px solid #444C56;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      user-select: none;
    }

    .sinnote-sel-palette[hidden] {
      display: none !important;
    }

    .sinnote-sel-palette-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 220px;
      margin-bottom: 6px;
    }

    .sinnote-sel-clear {
      width: 100%;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #30363D;
      background: #21262D;
      color: #C9D1D9;
      font-size: 11px;
      cursor: pointer;
    }

    .sinnote-sel-clear:hover {
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .sinnote-pop-footer {
      border-top: 1px solid #30363D;
      padding-top: 8px;
      margin-top: 2px;
    }

    /* 画布缩放右下角轻提示（Ctrl+滚轮缩放时瞬时显示） */
    .sinnote-zoom-hud {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 999995;
      background: rgba(22, 27, 34, 0.92);
      border: 1px solid #444C56;
      color: #E6EDF3;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-family: Consolas, "Microsoft YaHei UI", monospace;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease;
    }

    .sinnote-zoom-hud.is-visible {
      opacity: 1;
    }

    /* CSS Highlight API 查找命中高亮（零 DOM 侵入，不污染 Markdown） */
    ::highlight(sinnote-find-all) {
      background-color: rgba(163, 113, 247, 0.38);
      color: #FFFFFF;
    }

    ::highlight(sinnote-find-active) {
      background-color: #D29922;
      color: #0D1117;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #30363D;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #484F58;
    }
  </style>
</head>
<body>
  <div id="vditor"></div>

  <!-- 表格专属悬浮操作条（光标进入任意单元格时显示在表格正上方，不含删表格以免误删） -->
  <div id="table-bar" class="sinnote-table-bar" hidden>
    <button type="button" class="sinnote-tbl-btn" data-act="rowAbove" title="在当前行上方插入一行">+ 上插行</button>
    <button type="button" class="sinnote-tbl-btn" data-act="rowBelow" title="在当前行下方插入一行">+ 下插行</button>
    <button type="button" class="sinnote-tbl-btn" data-act="delRow" title="删除当前行">- 删行</button>
    <span class="sinnote-tbl-sep"></span>
    <button type="button" class="sinnote-tbl-btn" data-act="colLeft" title="在当前列左侧插入一列">+ 左插列</button>
    <button type="button" class="sinnote-tbl-btn" data-act="colRight" title="在当前列右侧插入一列">+ 右插列</button>
    <button type="button" class="sinnote-tbl-btn" data-act="delCol" title="删除当前列">- 删列</button>
    <span class="sinnote-tbl-sep"></span>
    <button type="button" class="sinnote-tbl-btn" data-act="moveUp" title="将当前数据行上移一行">↑ 上移</button>
    <button type="button" class="sinnote-tbl-btn" data-act="moveDown" title="将当前数据行下移一行">↓ 下移</button>
    <span class="sinnote-tbl-sep"></span>
    <span id="table-dim" class="sinnote-tbl-dim">3 × 3</span>
  </div>

  <!-- 表格颜色弹出浮层 -->
  <div id="color-popover" class="sinnote-popover" hidden>
    <div id="color-pop-title" class="sinnote-pop-title">选择表格颜色</div>
    <div id="color-pop-swatches" class="sinnote-swatches"></div>
    <div class="sinnote-pop-hint">自定义十六进制（如 #2F75B5 或 #BDD7EE）</div>
    <div class="sinnote-hex-row">
      <input id="color-hex-input" type="text" class="sinnote-hex-input" maxlength="9" placeholder="#2F75B5" />
      <button id="color-hex-apply" type="button" class="sinnote-pop-btn primary">应用</button>
    </div>

      function normalizeHexOrNull(raw) {
        if (typeof raw !== 'string') return null;
        let t = raw.trim();
        if (!t.startsWith('#')) t = '#' + t;
        const hex = t.slice(1);
        if (/^[0-9a-f]{6}$/i.test(hex)) return '#' + hex.toUpperCase();
        if (/^[0-9a-f]{3}$/i.test(hex)) {
          return '#' + (hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]).toUpperCase();
        }
        return null;
      }

      function pickContrastForeground(hex) {
        const norm = normalizeHexOrNull(hex);
        if (!norm) return '#E6EDF3';
        const n = parseInt(norm.slice(1), 16);
        const r = (n >> 16) & 255;
        const g = (n >> 8) & 255;
        const b = n & 255;
        const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luma >= 0.58 ? '#111827' : '#FFFFFF';
      }

      function syncToolbarSwatches() {

        const s2 = document.getElementById('tb-swatch-firstcol');

      function setCanvasZoom(nextPercent, notifyHost, showHud) {
        const clamped = Math.min(200, Math.max(50, Math.round(nextPercent / 10) * 10 || 100));

      function emitContentChangedImmediate() {
        if (!vditor || !isEditorReady || !currentPageId || isProgrammatic) return;
        if (changeTimer) {
          clearTimeout(changeTimer);
          changeTimer = null;
        }
        postToHost({
          type: 'contentChanged',

        });

      function scheduleContentChanged() {
        if (!vditor || !isEditorReady || !currentPageId || isProgrammatic) return;
        if (changeTimer) clearTimeout(changeTimer);
        const capturedPageId = currentPageId;
        changeTimer = setTimeout(() => {
          changeTimer = null;
          if (!vditor || !isEditorReady || isProgrammatic || currentPageId !== capturedPageId) return;
          postToHost({
            type: 'contentChanged',
            pageId: capturedPageId,
            markdown: vditor.getValue()
          });
        }, 200);
      }

      function compressImageFile(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onerror = () => resolve(null);
          reader.onload = () => {
            const rawUrl = reader.result;
            if (typeof rawUrl !== 'string') {
              resolve(null);
              return;
            }

            if (file.type === 'image/gif') {
              resolve(rawUrl);
              return;
            }

            const img = new Image();
            img.onerror = () => resolve(rawUrl);
            img.onload = () => {
              const maxWidth = 1600;
              const needResize = img.width > maxWidth;
              if (!needResize && rawUrl.length <= 220 * 1024) {
                resolve(rawUrl);
                return;
              }

              const scale = needResize ? maxWidth / img.width : 1;
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                resolve(rawUrl);
                return;
              }

              ctx.drawImage(img, 0, 0, w, h);
              const pngUrl = canvas.toDataURL('image/png');
              if (pngUrl.length <= 220 * 1024) {
                resolve(pngUrl);
                return;
              }

              const jpegCanvas = document.createElement('canvas');
              jpegCanvas.width = w;
              jpegCanvas.height = h;
              const jctx = jpegCanvas.getContext('2d');
              if (jctx) {
                jctx.fillStyle = '#0D1117';
                jctx.fillRect(0, 0, w, h);
                jctx.drawImage(img, 0, 0, w, h);
                const jpegUrl = jpegCanvas.toDataURL('image/jpeg', 0.85);
                resolve(jpegUrl.length < pngUrl.length ? jpegUrl : pngUrl);
                return;
              }

              resolve(pngUrl);
            };
            img.src = rawUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      function extFromMime(mime) {
        const m = (mime || '').toLowerCase();
        if (m.includes('jpeg') || m.includes('jpg')) return '.jpg';
        if (m.includes('gif')) return '.gif';
        if (m.includes('webp')) return '.webp';
        if (m.includes('bmp')) return '.bmp';
        return '.png';
      }

      async function handleUploadFiles(files) {
        if (!vditor || !currentPageId || !files || files.length === 0) return null;
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          if (!file || (file.type && !file.type.startsWith('image/'))) continue;
          const dataUrl = await compressImageFile(file);
          if (!dataUrl) continue;

          const m = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/i.exec(dataUrl);
          if (!m) continue;
          const mimeType = m[1];
          const base64 = m[2];
          const imageId = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + extFromMime(mimeType);
          const safeAlt = (file.name || 'image').replace(/[\[\]\r\n]/g, '').trim() || 'image';

          // 将图片二进制交由宿主缓存落盘并入库，再由宿主回调插入极短的虚拟地址链接，彻底避免 Base64 撑死编辑器
          postToHost({
            type: 'saveImage',
            pageId: currentPageId,
            imageId: imageId,
            mimeType: mimeType,
            base64: base64,
            alt: safeAlt
          });
        }
        return null;
      }

      function isCaretInTableCell() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return false;
        let node = sel.anchorNode;
        if (!node) return false;
        if (node.nodeType === 3) node = node.parentElement;
        return Boolean(node && node.closest && node.closest('td, th'));
      }

      function getActiveEditorElement() {
        if (!vditor || !vditor.vditor) return document.body;
        const core = vditor.vditor;
        const mode = core.currentMode || 'ir';
        if (mode === 'wysiwyg' && core.wysiwyg && core.wysiwyg.element) return core.wysiwyg.element;
        if (mode === 'sv' && core.sv && core.sv.element) return core.sv.element;
        if (core.ir && core.ir.element) return core.ir.element;
        return document.getElementById('vditor');
      }

      function clearSearchHighlight() {
        if (window.CSS && CSS.highlights) {
          CSS.highlights.delete('sinnote-find-all');
          CSS.highlights.delete('sinnote-find-active');
        }
      }

      function highlightSearch(query, targetOccurrenceIndex) {
        clearSearchHighlight();
        if (!query || !query.trim() || !window.CSS || !CSS.highlights) return;
        const q = query.trim().toLowerCase();
        const root = getActiveEditorElement();
        if (!root) return;

        const ranges = [];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue || !node.parentElement) return NodeFilter.FILTER_REJECT;
            const parent = node.parentElement;
            const style = window.getComputedStyle(parent);
            if (style.display === 'none' || style.visibility === 'hidden') return NodeFilter.FILTER_REJECT;
            if (parent.closest('.vditor-ir__marker--link')
              && (node.nodeValue.includes('data:image/') || node.nodeValue.includes('sinnote-img.local/'))) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        });

        let node;
        while ((node = walker.nextNode())) {
          const text = node.nodeValue.toLowerCase();
          let start = 0;
          while (true) {
            const idx = text.indexOf(q, start);
            if (idx < 0) break;
            const range = document.createRange();
            range.setStart(node, idx);
            range.setEnd(node, idx + q.length);
            ranges.push(range);
            start = idx + Math.max(1, q.length);
          }
        }

        if (ranges.length === 0) return;
        CSS.highlights.set('sinnote-find-all', new Highlight(...ranges));

        const activeIdx = Math.min(Math.max(0, targetOccurrenceIndex || 0), ranges.length - 1);
        const activeRange = ranges[activeIdx];
        CSS.highlights.set('sinnote-find-active', new Highlight(activeRange));

        const rect = activeRange.getBoundingClientRect();
        if (rect && (rect.width > 0 || rect.height > 0)) {
          const container = root;
          if (container && container.scrollHeight > container.clientHeight) {
            const cRect = container.getBoundingClientRect();
            const delta = rect.top - cRect.top - cRect.height / 2;
            container.scrollBy({ top: delta, behavior: 'smooth' });
          } else if (activeRange.startContainer.parentElement) {
            activeRange.startContainer.parentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }

      // ---------- 图片选中与删除、双击页内放大 ----------
      function clearSelectedImage() {
        if (selectedImageEl) {
          selectedImageEl.classList.remove('sinnote-img-selected');
          selectedImageEl = null;
        }
      }

      function selectImageElement(img) {
        if (!img) return;
        if (selectedImageEl && selectedImageEl !== img) {
          selectedImageEl.classList.remove('sinnote-img-selected');
        }
        selectedImageEl = img;
        img.classList.add('sinnote-img-selected');

        const root = getActiveEditorElement();
        if (root && document.activeElement !== root) {
          root.focus({ preventScroll: true });
        }
      }

      function deleteSelectedImage() {
        if (!selectedImageEl || !document.body.contains(selectedImageEl)) {
          clearSelectedImage();
          return false;
        }

        const img = selectedImageEl;
        const wrapper = img.closest('span.vditor-ir__node[data-type="img"]')
          || img.closest('span.vditor-ir__node')
          || img;
        const parent = wrapper.parentNode;
        const idx = parent ? Array.prototype.indexOf.call(parent.childNodes, wrapper) : -1;

        recordUndoSnapshot();
        wrapper.remove();
        clearSelectedImage();

        if (parent && parent.isConnected) {
          try {
            const sel = window.getSelection();
            const range = document.createRange();
            const safeIdx = Math.max(0, Math.min(idx, parent.childNodes.length));
            range.setStart(parent, safeIdx);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
          } catch (_) {
            // ignore
          }
        }

        recordUndoSnapshot();
        emitContentChangedImmediate();
        return true;
      }

      function closeAllPopovers() {

      function clearTableCellSelection() {

      function hideSelectionBar() {
        if (selectionBar) selectionBar.hidden = true;
        if (selectionPalette) selectionPalette.hidden = true;
        activePaletteKind = null;
      }

      function applyLoadPayload(payload) {
        if (!payload) return;
        if (!vditor || !isEditorReady) {
          pendingLoad = payload;
          return;
        }

        const nextPageId = payload.pageId || null;
        if (changeTimer && currentPageId && currentPageId !== nextPageId && !isProgrammatic) {
          emitContentChangedImmediate();
        } else if (changeTimer) {
          clearTimeout(changeTimer);
          changeTimer = null;
        }

        const nextMd = typeof payload.markdown === 'string' ? payload.markdown : '';
        let currentVal = '';
        try {
          currentVal = vditor.getValue();
        } catch (_) {
          currentVal = '__err__';
        }
        const shouldReloadValue = Boolean(payload.force) || currentPageId !== nextPageId || currentVal !== nextMd;
        currentPageId = nextPageId;
        try { applyTableColors(payload.colors); } catch (_) {}
        try { applyTypography(payload.typography); } catch (_) {}
        try { closeAllPopovers(); } catch (_) {}
        try { hideSelectionBar(); } catch (_) {}
        try { clearTableCellSelection(); } catch (_) {}

        if (shouldReloadValue) {
          try { clearSearchHighlight(); } catch (_) {}
          try { clearSelectedImage(); } catch (_) {}
          try { hideTableBar(); } catch (_) {}
          isProgrammatic = true;
          try {
            vditor.setValue(nextMd, true);
          } finally {
            setTimeout(() => {
              isProgrammatic = false;
              hydrateInlineHtmlStyles();
            }, 40);
          }
        } else {
          hydrateInlineHtmlStyles();
        }
      }

      window.sinNoteApi = {
        loadPage: applyLoadPayload,
        setTableColors: applyTableColors,
        setTypography: applyTypography,
        setSystemFonts(list) {
          if (Array.isArray(list) && list.length > 0) {
            systemFonts = list.filter((f) => f && typeof f.name === 'string' && typeof f.css === 'string');
          }
        },
        insertImageUrl(alt, url) {
          if (!vditor || !isEditorReady || !url) return;
          const safeAlt = (alt || 'image').replace(/[\[\]\r\n]/g, '').trim() || 'image';
          const md = '![' + safeAlt + '](' + url + ')';
          const inCell = isCaretInTableCell();
          vditor.focus();
          vditor.insertValue(inCell ? md : ('\n' + md + '\n'), true);
          emitContentChangedImmediate();
        },
        highlightSearch,
        clearSearchHighlight,
        focusEditor() {
          if (vditor && isEditorReady) vditor.focus();
        },
        flush() {
          emitContentChangedImmediate();
        }
      };

      window.addEventListener('wheel', (e) => {
        if (e.ctrlKey) {
          e.preventDefault();
          e.stopPropagation();
          if (e.deltaY === 0) return;
          const step = e.deltaY < 0 ? 10 : -10;
          setCanvasZoom(currentZoomPercent + step, true, true);
        }
      }, { passive: false, capture: true });

      function handleTableProgressiveSelectAll() {
        const root = getActiveEditorElement();
        if (!root) return false;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return false;

        let anchor = sel.anchorNode;
        if (!anchor) return false;
        if (anchor.nodeType === 3) anchor = anchor.parentElement;
        if (!anchor || !root.contains(anchor)) return false;

        const cell = anchor.closest ? anchor.closest('td, th') : null;
        const table = cell ? cell.closest('table') : (tableSelectStage >= 2 ? tableSelectTable : null);
        if (!table || !root.contains(table)) {
          clearTableCellSelection();
          return false;
        }

        const effectiveCell = cell || tableSelectCell;
        if (!effectiveCell) return false;

        // 判断是否在同一单元格上连续按 Ctrl+A
        const sameTarget = (tableSelectTable === table) && (tableSelectCell === effectiveCell);
        const nextStage = sameTarget ? (tableSelectStage + 1) : 1;

        document.querySelectorAll('.sinnote-cell-selected').forEach((el) => el.classList.remove('sinnote-cell-selected'));

        if (nextStage === 1) {
          // 第 1 次 Ctrl+A：选中当前单元格内的所有内容
          const range = document.createRange();
          range.selectNodeContents(effectiveCell);
          sel.removeAllRanges();
          sel.addRange(range);
          tableSelectStage = 1;
          tableSelectCell = effectiveCell;
          tableSelectTable = table;
          return true;
        }

        if (nextStage === 2) {
          // 第 2 次 Ctrl+A（Ctrl+A+A）：选中当前单元格
          effectiveCell.classList.add('sinnote-cell-selected');
          const range = document.createRange();
          range.selectNodeContents(effectiveCell);
          sel.removeAllRanges();
          sel.addRange(range);
          tableSelectStage = 2;
          tableSelectCell = effectiveCell;
          tableSelectTable = table;
          return true;
        }

        if (nextStage === 3) {
          // 第 3 次 Ctrl+A（Ctrl+A+A+A）：选中当前表格内所有单元格
          table.querySelectorAll('th, td').forEach((c) => c.classList.add('sinnote-cell-selected'));
          const range = document.createRange();
          range.selectNode(table);
          sel.removeAllRanges();
          sel.addRange(range);
          tableSelectStage = 3;
          tableSelectCell = effectiveCell;
          tableSelectTable = table;
          return true;
        }

        // 第 4 次 Ctrl+A：全选整页正文
        clearTableCellSelection();
        const fullRange = document.createRange();
        fullRange.selectNodeContents(root);
        sel.removeAllRanges();
        sel.addRange(fullRange);
        return true;
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const previewLayer = document.querySelector('.vditor-img');
          if (previewLayer) {
            e.preventDefault();
            e.stopPropagation();
            previewLayer.remove();
            document.body.style.overflow = '';
            return;
          }

          if ((colorPopover && !colorPopover.hidden) || (fontPopover && !fontPopover.hidden) || (selectionPalette && !selectionPalette.hidden)) {
            e.preventDefault();
            e.stopPropagation();
            closeAllPopovers();
            return;
          }

          if (tableSelectStage > 0) {
            e.preventDefault();
            clearTableCellSelection();
            return;
          }

          if (selectedImageEl) {
            e.preventDefault();
            clearSelectedImage();
            return;
          }
        }

        if ((e.key === 'Backspace' || e.key === 'Delete') && !e.ctrlKey && !e.altKey && !e.metaKey) {
          if (selectedImageEl && document.body.contains(selectedImageEl)) {
            e.preventDefault();
            e.stopPropagation();
            deleteSelectedImage();
            return;
          }

          if (tableSelectStage === 2 && tableSelectCell && document.body.contains(tableSelectCell)) {
            e.preventDefault();
            e.stopPropagation();
            recordUndoSnapshot();
            tableSelectCell.innerHTML = '';
            const c = tableSelectCell;
            clearTableCellSelection();
            placeCaretInCell(c);
            recordUndoSnapshot();
            emitContentChangedImmediate();
            return;
          }

          if (tableSelectStage === 3 && tableSelectTable && document.body.contains(tableSelectTable)) {
            e.preventDefault();
            e.stopPropagation();
            recordUndoSnapshot();
            const firstCell = tableSelectTable.querySelector('th, td');
            tableSelectTable.querySelectorAll('th, td').forEach((c) => { c.innerHTML = ''; });
            clearTableCellSelection();
            if (firstCell) placeCaretInCell(firstCell);
            recordUndoSnapshot();
            emitContentChangedImmediate();
            return;
          }

          // 修复：表格单元格内多行内容（以 <br> 分隔）在第二行行首按 Backspace 时，
          // Vditor 会误判为“单元格开头”而直接跳到左侧单元格且不删除换行。
          if (e.key === 'Backspace' && tryDeletePrecedingBrInTableCell()) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return;
          }
        }

        if (selectedImageEl && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) {
          clearSelectedImage();
        }

        // Ctrl+Alt+H：快速给选中文本应用当前高亮色（与 OneNote 快捷键一致）
        if (e.ctrlKey && e.altKey && (e.key || '').toUpperCase() === 'H') {
          const sel = window.getSelection();
          if (sel && !sel.isCollapsed && sel.rangeCount > 0) {
            e.preventDefault();
            e.stopPropagation();
            savedSelectionRange = sel.getRangeAt(0).cloneRange();
            applyHighlightToSelection(currentHighlight.bg, currentHighlight.fg);
            return;
          }
        }

        if (e.ctrlKey && !e.altKey && !e.shiftKey && (e.key || '').toUpperCase() === 'A') {
          const activeEl = document.activeElement;
          const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
          if (!isInput && handleTableProgressiveSelectAll()) {
            e.preventDefault();
            e.stopPropagation();
            updateSelectionBarSoon();
            return;
          }
        } else if (!e.ctrlKey || (e.key || '').toUpperCase() !== 'C') {
          if (tableSelectStage > 0 && e.key !== 'Control') {
            clearTableCellSelection();
          }
        }

        if (e.ctrlKey && !e.altKey) {
          const k = (e.key || '').toUpperCase();
          if (k === 'F' || k === 'E') {
            e.preventDefault();
            e.stopPropagation();
            closeAllPopovers();
            postToHost({ type: 'shortcut', key: k });
            return;
          }
          if (k === 'S') {
            e.preventDefault();
            e.stopPropagation();
            emitContentChangedImmediate();
            postToHost({ type: 'shortcut', key: 'S' });
            return;
          }
          if (e.key === '0' || e.code === 'Numpad0') {
            e.preventDefault();
            e.stopPropagation();
            setCanvasZoom(100, true, true);
            return;
          }
          if (e.key === '=' || e.key === '+' || e.code === 'NumpadAdd') {
            e.preventDefault();
            e.stopPropagation();
            setCanvasZoom(currentZoomPercent + 10, true, true);
            return;
          }
          if (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract') {
            e.preventDefault();
            e.stopPropagation();
            setCanvasZoom(currentZoomPercent - 10, true, true);
            return;
          }
        }
      }, true);

      document.addEventListener('mousedown', (e) => {
        postToHost({ type: 'editorFocused' });

        const target = e.target;
        const inPop = (colorPopover && colorPopover.contains(target))
          || (fontPopover && fontPopover.contains(target))
          || (selectionBar && selectionBar.contains(target))
          || (selectionPalette && selectionPalette.contains(target))
          || (target && target.closest && target.closest('.sinnote-tb-btn'));
        if (!inPop) {
          closeAllPopovers();
          clearTableCellSelection();
        }

        if (target && target.tagName === 'IMG' && target.closest('.vditor-reset') && !target.closest('.vditor-img')) {
          if (e.button === 0 && !e.ctrlKey && !e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            selectImageElement(target);
            return;
          }
        }

        if (!(selectionBar && selectionBar.contains(target)) && !(selectionPalette && selectionPalette.contains(target))) {
          clearSelectedImage();
        }
      }, true);

      document.addEventListener('paste', (e) => {
        if (!vditor || !vditor.vditor) return;
        if ((vditor.vditor.currentMode || 'ir') === 'sv') return;

        const root = getActiveEditorElement();
        const sel = window.getSelection();
        if (!root || !sel || sel.rangeCount === 0) return;

        let anchor = sel.anchorNode;
        if (!anchor) return;
        if (anchor.nodeType === 3) anchor = anchor.parentElement;
        if (!anchor || !root.contains(anchor)) return;

        const cell = anchor.closest ? anchor.closest('td, th') : null;
        if (!cell || !root.contains(cell)) return;

        const dt = e.clipboardData;
        if (!dt) return;

        // 剪贴板含图片文件时交给 Vditor 的上传/压缩流程处理
        if (dt.files && dt.files.length > 0) {
          for (let i = 0; i < dt.files.length; i++) {
            if (dt.files[i].type && dt.files[i].type.startsWith('image/')) {
              return;
            }
          }
        }

        // 剪贴板若是完整的 HTML 表格（如从 Excel 多列复制），放行原生处理
        const htmlText = dt.getData('text/html') || '';
        if (/<table[\s>]/i.test(htmlText) && /<td[\s>]/i.test(htmlText)) {
          // 仅当包含多列单元格时放行；单单元格多行 HTML 仍落入当前单元格
          const tdMatches = htmlText.match(/<(td|th)[\s>]/gi);
          if (tdMatches && tdMatches.length > 1) {
            return;
          }
        }

        const plain = dt.getData('text/plain');
        if (!plain || (!plain.includes('\n') && !plain.includes('\r'))) {
          return;
        }

        // 多行文本粘贴进单个表格单元格：转为单元格内 <br> 换行，绝不拆散到多行表格或外部段落
        e.preventDefault();
        e.stopPropagation();

        const normalized = plain.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n+$/g, '');
        const lines = normalized.split('\n');
        if (lines.length === 0) return;

        recordUndoSnapshot();

        const range = sel.getRangeAt(0);
        // 若选区跨越了单元格边界，收拢到当前单元格内
        if (!cell.contains(range.endContainer)) {
          range.selectNodeContents(cell);
          range.collapse(false);
        } else if (!range.collapsed) {
          range.deleteContents();
        }

        const frag = document.createDocumentFragment();
        let lastNode = null;
        lines.forEach((line, idx) => {
          if (idx > 0) {
            const br = document.createElement('br');
            frag.appendChild(br);
            lastNode = br;
          }
          if (line.length > 0) {
            const tn = document.createTextNode(line);
            frag.appendChild(tn);
            lastNode = tn;
          }
        });

        range.insertNode(frag);
        if (lastNode) {
          const caretRange = document.createRange();
          caretRange.setStartAfter(lastNode);
          caretRange.collapse(true);
          sel.removeAllRanges();
          sel.addRange(caretRange);
        }

        recordUndoSnapshot();
        updateTableBarSoon();
        emitContentChangedImmediate();
      }, true);

      document.addEventListener('dblclick', (e) => {
        const target = e.target;
        if (target && target.tagName === 'IMG' && target.closest('.vditor-reset') && !target.closest('.vditor-img')) {
          e.preventDefault();
          e.stopPropagation();
          clearSelectedImage();
          if (window.Vditor && typeof window.Vditor.previewImage === 'function' && !document.querySelector('.vditor-img')) {
            window.Vditor.previewImage(target, 'zh_CN', 'dark');
          }
        }
      }, true);

      document.addEventListener('click', (e) => {
        const target = e.target;
        if (target && target.tagName === 'IMG' && target.closest('.vditor-reset') && !target.closest('.vditor-img')) {
          if (!e.ctrlKey && !e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
        }

        const link = target && target.closest ? target.closest('a[href]') : null;
        if (link && (e.ctrlKey || link.closest('.vditor-preview'))) {
          const href = link.getAttribute('href') || '';
          if (/^https?:\/\//i.test(href)) {
            e.preventDefault();
            postToHost({ type: 'openLink', url: href });
          }
        }
      }, true);

      vditor = new Vditor('vditor', {
        mode: 'ir',
        theme: 'dark',
        lang: 'zh_CN',
        icon: 'ant',
        cdn: 'https://sinnote.local/vditor',
        width: '100%',
        height: '100%',
        cache: { enable: false },
        placeholder: '开始输入 Markdown（# 标题、- 列表、``` 代码块、| 列1 | 列2 | 表格，Ctrl+V 粘贴截图，单击选图退格删除 / 双击页内放大）...',
        toolbarConfig: {
          pin: true
        },
        toolbar: [
          'headings',
          'bold',
          'italic',
          'strike',
          '|',
          'list',
          'ordered-list',
          'check',
          '|',
          'quote',
          'code',
          'inline-code',
          'table',
          'link',
          'upload',
          '|',
          'undo',
          'redo',
          '|',
          'edit-mode',
          'outline'
        ],
        image: {
          isPreview: false
        },
        preview: {
          markdown: {
            sanitize: false,
            mark: true
          },
          theme: {
            current: 'dark',
            path: 'https://sinnote.local/vditor/dist/css/content-theme'
          },
          hljs: {
            enable: true,
            style: 'github-dark',
            lineNumber: false
          }
        },
        upload: {
          accept: 'image/*',
          multiple: true,
          handler: handleUploadFiles
        },
        after() {
          isEditorReady = true;
          enhanceToolbarTooltips();
          appendCustomToolbarItems();
          bindPopoverEvents();
          bindTableFloatingBar();
          bindSelectionToolbar();
          observeEditorInlineStyles();
          postToHost({ type: 'ready' });
          if (pendingLoad) {
            const p = pendingLoad;
            pendingLoad = null;
            applyLoadPayload(p);
          }
        },
        input() {
          clearSearchHighlight();
          clearSelectedImage();
          scheduleContentChanged();
          updateTableBarSoon();
          scheduleHydrateStyles();
        },
        blur() {
          emitContentChangedImmediate();
        }
      });

      // ---------- 工具栏悬停说明增强与结尾整合 4 个自定义按钮 ----------
      function enhanceToolbarTooltips() {
        const map = {
          headings: '标题（H1~H6 多级标题）',
          bold: '粗体（加粗选中文字 <Ctrl+B>）',
          italic: '斜体（倾斜选中文字 <Ctrl+I>）',
          strike: '删除线（给文字加横线）',
          list: '无序列表（项目圆点列表）',
          'ordered-list': '有序列表（1. 2. 3. 编号列表）',
          check: '任务列表（可勾选待办事项）',
          quote: '引用块（段落缩进高亮引用）',
          code: '代码块（多行代码高亮块）',
          'inline-code': '行内代码（命令/变量高亮标记）',
          table: '插入表格（点击表格内可增删行列）',
          link: '插入链接（网页超链接）',
          upload: '上传/插入图片（也可直接 Ctrl+V 粘贴截图）',
          undo: '撤销上一步操作 <Ctrl+Z>',
          redo: '重做下一步操作 <Ctrl+Y>',
          'edit-mode': '切换编辑模式（即时渲染 / 所见即所得 / 分屏源码）',
          outline: '显示或隐藏文档大纲'
        };
        document.querySelectorAll('.vditor-toolbar button[data-type]').forEach((btn) => {
          const t = btn.getAttribute('data-type');
          if (t && map[t]) {
            btn.setAttribute('aria-label', map[t]);
          }
        });
      }

      function positionPopoverUnder(popEl, anchorEl) {
        if (!popEl || !anchorEl) return;
        const rect = anchorEl.getBoundingClientRect();
        popEl.hidden = false;
        const popRect = popEl.getBoundingClientRect();
        let left = rect.left;
        const maxLeft = Math.max(8, window.innerWidth - popRect.width - 12);
        left = Math.min(Math.max(8, left), maxLeft);
        const top = Math.round(rect.bottom + 6);
        popEl.style.left = Math.round(left) + 'px';
        popEl.style.top = top + 'px';
      }

      function commitTableColors() {
        applyTableColors({
          headerBg: currentHeaderBg,
          firstColBg: currentFirstColBg,
          cellBg: currentCellBg
        });
        postToHost({
          type: 'tableColorsChanged',
          headerBg: currentHeaderBg,
          firstColBg: currentFirstColBg,
          cellBg: currentCellBg
        });
      }

      function applyColorHexForTarget(hex) {
        const norm = normalizeHexOrNull(hex);
        if (!norm) return false;
        if (activeColorTarget === 'firstCol') {
          currentFirstColBg = norm;
        } else if (activeColorTarget === 'cell') {
          currentCellBg = norm;
        } else {
          currentHeaderBg = norm;
        }
        commitTableColors();
        return true;
      }

      function openColorPopover(targetKey, anchorBtn) {
        const wasOpenSame = !colorPopover.hidden && activeColorTarget === targetKey;
        closeAllPopovers();
        if (wasOpenSame) return;

        activeColorTarget = targetKey;
        colorPopTitle.textContent = targetKey === 'firstCol'
          ? '选择第一列背景色'
          : targetKey === 'cell'
            ? '选择其余正文单元格背景色'
            : '选择第一行（表头）背景色';

        colorHexInput.value = targetKey === 'firstCol'
          ? currentFirstColBg
          : targetKey === 'cell'
            ? currentCellBg
            : currentHeaderBg;

        const presets = targetKey === 'cell' ? CELL_COLOR_PRESETS : HEADER_COLOR_PRESETS;
        colorPopSwatches.innerHTML = '';
        presets.forEach((p) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'sinnote-swatch-btn';
          btn.style.backgroundColor = p.hex;
          btn.title = p.name + ' (' + p.hex + ')';
          btn.addEventListener('click', () => {
            applyColorHexForTarget(p.hex);
            colorPopover.hidden = true;
          });
          colorPopSwatches.appendChild(btn);
        });

        positionPopoverUnder(colorPopover, anchorBtn);
      }

      function renderSystemFontList(filterText) {
        if (!fontPopList) return;
        const q = (filterText || '').trim().toLowerCase();
        fontPopList.innerHTML = '';

        const allItems = [{ name: '微软雅黑（默认）', css: DEFAULT_FONT_FAMILY }].concat(
          systemFonts.filter((f) => f.css.toLowerCase() !== DEFAULT_FONT_FAMILY.toLowerCase())
        );
        const filtered = q
          ? allItems.filter((f) => f.name.toLowerCase().includes(q) || f.css.toLowerCase().includes(q))
          : allItems;

        if (fontPopCount) {
          fontPopCount.textContent = filtered.length + ' 种';
        }

        if (filtered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'sinnote-pop-hint';
          empty.style.padding = '12px 6px';
          empty.textContent = '未找到匹配的系统字体';
          fontPopList.appendChild(empty);
          return;
        }

        const frag = document.createDocumentFragment();
        filtered.forEach((p) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'sinnote-font-item';
          const isActive = currentFontFamily.toLowerCase() === p.css.toLowerCase()
            || currentFontFamily.split(',')[0].replace(/["']/g, '').trim().toLowerCase() === p.name.replace('（默认）', '').toLowerCase();
          if (isActive) {
            item.classList.add('is-active');
          }
          item.style.fontFamily = p.css;
          item.textContent = p.name;
          item.title = p.name;
          item.addEventListener('click', () => {
            if (fontPopoverHasSelection && savedFontSelectionRange) {
              applyFontFamilyToSelection(p.css, savedFontSelectionRange);
            } else {
              applyTypography({ fontFamily: p.css });
              postToHost({ type: 'fontFamilyChanged', fontFamily: p.css });
            }
            fontPopover.hidden = true;
          });
          frag.appendChild(item);
        });
        fontPopList.appendChild(frag);
      }

      function openFontPopover(anchorBtn) {
        const wasOpen = !fontPopover.hidden;
        closeAllPopovers();
        if (wasOpen) return;

        // 判断打开时是否存在有效文字/表格选区：有选区则仅改选中区域字体，不影响其他位置
        const liveRange = getLiveOrSavedRange();
        fontPopoverHasSelection = Boolean(liveRange && !liveRange.collapsed);
        savedFontSelectionRange = fontPopoverHasSelection ? liveRange.cloneRange() : null;
        if (fontPopTitle) {
          fontPopTitle.textContent = fontPopoverHasSelection
            ? '修改选中文字字体（仅局部生效）'
            : '正文字体格式（未选中，改默认字体）';
        }

        if (fontSearchInput) {
          fontSearchInput.value = '';
        }
        renderSystemFontList('');
        syncFontToolbarLabel();
        positionPopoverUnder(fontPopover, anchorBtn);

        if (fontSearchInput) {
          setTimeout(() => fontSearchInput.focus(), 10);
        }
      }

      function appendCustomToolbarItems() {

      function bindPopoverEvents() {
